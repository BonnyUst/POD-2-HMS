<div class="login-page">

  <div class="login-container">

    <!-- LEFT BRANDING -->
    <div class="login-branding">
      <div class="branding-content">
        <div class="brand-badge">HMS Portal</div>

        <h1>Welcome Back</h1>

        <p>
          Login to access the hospital management system dashboard and manage operations efficiently.
        </p>

        <div class="branding-actions">
          <a routerLink="/join-us" class="join-us-button">Join Us</a>
          <p>New employee? Request access from administrator</p>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="login-panel">

      <div class="login-card">

        <div class="login-header">
          <h2>Login</h2>
          <p>Enter your credentials to continue</p>
        </div>

        <form class="login-form-content">

          <!-- EMAIL -->
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              class="enterprise-input"
              placeholder="Enter your email"
              name="email"
              [(ngModel)]="email"
            />
          </div>

          <!-- PASSWORD -->
          <div class="form-group">
            <div class="password-header">
              <label>Password</label>
              <a class="forgot-password-link">Forgot Password?</a>
            </div>

            <input
              type="password"
              class="enterprise-input"
              placeholder="Enter your password"
              name="password"
              [(ngModel)]="password"
            />
          </div>

          <!-- BUTTON -->
          <button
            type="button"
            class="login-button"
            (click)="onLogin()"
          >
            Login
          </button>

        </form>

        <!-- FOOTER -->
        <div class="login-footer">
          <p>
            Don’t have access?
            <a routerLink="/join-us" class="footer-register-link">Join Us</a>
          </p>
        </div>

      </div>

    </div>

  </div>

</div>
