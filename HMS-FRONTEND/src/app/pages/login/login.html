<div class="login-container">

    <div class="login-box">

        <h1>Login</h1>
        <form action="">
            <input type="email" placeholder="Enter Your Email" name="email" [(ngModel)]="email">
            <input type="password" placeholder="Enter the passsword" name="passsword" [(ngModel)]="password">
            <div class="action-box">
                <button type="button" (click)="onLogin()">Login</button>
                <p class="join-text">
                    <a routerLink="/join-us">Join Us</a>
                </p>

            </div>
        </form>
    </div>

    <div class="right-box">
    </div>
</div>
