<div class="navbar">

    <!-- LEFT -->
    <div class="navbar-left">
        <div class="logo">HMS Portal</div>
    </div>

    <!-- RIGHT -->
    <div class="navbar-right">

        <div class="profile-wrapper">

            <div class="profile-icon" (click)="toggleProfileDropdown()">
                👤
            </div>

            <div class="profile-dropdown" *ngIf="showProfileDropdown">

                <button class="dropdown-item" (click)="viewProfile()">
                    View Profile
                </button>

                <button class="dropdown-item logout" (click)="logout()">
                    Logout
                </button>

            </div>

        </div>

    </div>

</div>
