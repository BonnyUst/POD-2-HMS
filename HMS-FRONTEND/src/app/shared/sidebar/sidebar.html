<div class="sidebar">

  <div class="menu">

    @for(node of nodes; track node._id){
      <a 
        [routerLink]="getFullPath(node.path)"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i [class]="node.icon"></i>
        <span>{{ node.name }}</span>
      </a>
    }

  </div>

</div>
