<div class="profile-page">

  <div class="profile-topbar">

    <button
      class="back-btn"
      routerLink="/dashboard"
    >
      ← Back To Dashboard
    </button>

  </div>


  <div class="profile-card">

    <div class="profile-header">

      <div class="profile-image">

        <img
          [src]="profileImage"
          alt="profile"
        />

      </div>

      <div>

        <h1>
          My Profile
        </h1>

        <p>
          Manage your personal information
        </p>

      </div>

    </div>


    @if (successMessage) {

      <div class="success-message">
        {{ successMessage }}
      </div>

    }


    @if (errorMessage) {

      <div class="error-message">
        {{ errorMessage }}
      </div>

    }


    <form
      [formGroup]="profileForm"
      (ngSubmit)="updateProfile()"
    >

      <div class="form-grid">

        <div class="form-group">

          <label>
            First Name
          </label>

          <input
            type="text"
            formControlName="firstName"
          />

        </div>


        <div class="form-group">

          <label>
            Last Name
          </label>

          <input
            type="text"
            formControlName="lastName"
          />

        </div>


        <div class="form-group">

          <label>
            Phone
          </label>

          <input
            type="text"
            formControlName="phone"
          />

        </div>


        <div class="form-group">

          <label>
            Gender
          </label>

          <select formControlName="gender">

            <option value="MALE">
              Male
            </option>

            <option value="FEMALE">
              Female
            </option>

            <option value="OTHER">
              Other
            </option>

          </select>

        </div>


        <div class="form-group full-width">

          <label>
            Address
          </label>

          <textarea
            rows="4"
            formControlName="address"
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            Date Of Birth
          </label>

          <input
            type="date"
            formControlName="dateOfBirth"
          />

        </div>

      </div>


      <button
        type="submit"
        class="save-btn"
      >
        Save Changes
      </button>

    </form>

  </div>



  <div class="password-card">

    <h2>
      Reset Password
    </h2>

    <form
      [formGroup]="passwordForm"
      (ngSubmit)="changePassword()"
    >

      <div class="form-group">

        <label>
          Current Password
        </label>

        <input
          type="password"
          formControlName="currentPassword"
        />

      </div>


      <div class="form-group">

        <label>
          New Password
        </label>

        <input
          type="password"
          formControlName="newPassword"
        />

      </div>


      <button
        type="submit"
        class="save-btn"
      >
        Update Password
      </button>

    </form>

  </div>

</div>
