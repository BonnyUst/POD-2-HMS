name: Deploy HMS to EC2

on:
  push:
    branches:
      - feature/anshif-deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}

          script: |
            cd ~/POD-2-HMS

            git fetch origin
            git checkout feature/anshif-deployment
            git pull origin feature/anshif-deployment

            echo "===== Backend ====="
            cd HMS-BACKEND
            npm install
            pm2 restart hms-backend

            echo "===== Frontend ====="
            cd ../HMS-FRONTEND
            npm install
            npm run build

            sudo rm -rf /var/www/hms-frontend/*
            sudo cp -r dist/HMS-FRONTEND/browser/* /var/www/hms-frontend/

            sudo systemctl reload nginx

            echo "Deployment completed successfully!"
